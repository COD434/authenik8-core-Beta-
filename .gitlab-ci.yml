workflow:
  # Create pipelines for every branch/tag push and every merge request.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

stages:
  - lint
  - test
  - security
  - build
  - publish

include:
  # Official GitLab security templates.
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  # Keep npm cache inside the project directory so GitLab can cache it.
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  NPM_CONFIG_FUND: "false"
  # Security audit runs in its own job, so skip the install-time audit for speed.
  NPM_CONFIG_AUDIT: "false"
  # Integration tests use ioredis-mock and still namespace state per job.
  AUTHENIK8_TEST_NAMESPACE: "ci:${CI_PIPELINE_ID}:${CI_JOB_ID}"
  # Reduce noise and scanning time for generated content.
  SAST_EXCLUDED_PATHS: "dist,coverage,node_modules"

default:
  image: node:20-bookworm
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  before_script:
    - node --version
    - npm --version
    - npm ci --prefer-offline

lint:
  stage: lint
  script:
    - npm run lint
    - npm run typecheck

test:unit:
  
  stage: test
  coverage: '/Statements\s*:\s*([\d.]+)/'
  script:
    - mkdir -p reports/unit coverage/unit
    - npm run test:unit:ci
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - reports/unit/
      - coverage/unit/
    reports:
      junit: reports/unit/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/unit/cobertura-coverage.xml

test:integration:
  
  stage: test
  script:
    - mkdir -p reports/integration coverage/integration
    - npm run test:integration:ci
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - reports/integration/
      - coverage/integration/
    reports:
      junit: reports/integration/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/integration/cobertura-coverage.xml

test:matrix:

  stage: test
  parallel:
    matrix:
      - NODE_VERSION: ["22"]
  image: node:${NODE_VERSION}-bookworm
  script:
    - npm run test:matrix

security:

  stage: security
  script:
    - mkdir -p reports/security
    - npm audit --audit-level=low --json > reports/security/npm-audit.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - reports/security/npm-audit.json

build:
  stage: build
  script:
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - dist/

publish:
  stage: publish
  image: node:22-bookworm
  interruptible: false

  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore

  needs:
    - job: build
      artifacts: true
  before_script:
    - node --version
    - npm --version
    # This job overrides default.before_script, so install the compiler and test
    # tooling required by package.json's prepublishOnly safety gate.
    - npm ci --include=dev --prefer-offline
    - |
      if [ -z "${NPM_TOKEN:-}" ]; then
        echo "NPM_TOKEN is unavailable. Add it in GitLab CI/CD variables and ensure this release tag is protected."
        exit 1
      fi
    - |
      PACKAGE_VERSION=$(node -p "require('./package.json').version")
      if [ "v${PACKAGE_VERSION}" != "$CI_COMMIT_TAG" ]; then
        echo "Release tag ${CI_COMMIT_TAG} does not match package version ${PACKAGE_VERSION}."
        exit 1
      fi
    - npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
    - npm whoami --registry=https://registry.npmjs.org/
  script:
    - npm publish --provenance --access public
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
